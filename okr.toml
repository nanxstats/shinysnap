[project]
r-version = "4.6.1"
snapshot = "2026-09-16"
strict = false

[vendor]
path = "deps-src"
include-tests = true
exclude = []
gitignore = true

[manifest]
agents-file = false

[packages]
bslib = "*"
shinyMatrix = "*"
shinystate = "*"
rewind = "*"
formods = "*"
"blockr.session" = "*"
shinychat = "*"
ellmer = "*"
reactlog = "*"
shinyobjects = "*"
aurora = "*"
shinytest2 = "*"
chromote = "*"
R6 = "*"
htmltools = "*"
promises = "*"
jsonlite = "*"
withr = "*"
zip = "*"
zmij = "*"
httpuv = "*"
testthat = "*"

[references]
shiny = "rstudio/shiny"
shinyURL = "aoles/shinyURL"
extrachecks = "DavisVaughan/extrachecks"
