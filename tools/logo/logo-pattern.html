<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shinysnap generative logo field</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.brush@2.2.2/dist/p5.brush.js"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fdfdfd;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <script>
    window.addEventListener("error", function (event) {
      document.body.dataset.renderError = event.message;
    });
    window.addEventListener("unhandledrejection", function (event) {
      document.body.dataset.renderError = String(event.reason);
    });

    const ART_WIDTH = 1106;
    const ART_HEIGHT = 1280;
    const PAPER = "#fdfdfd";

    const PLANES = [
      {
        color: "#879da4",
        opacity: 136,
        underpaint: 46,
        bleed: 0.16,
        texture: 0.62,
        angle: 18,
        points: [
          [1240, -120], [610, -120], [430, 60], [565, 295],
          [910, 420], [1240, 310]
        ]
      },
      {
        color: "#c47e64",
        opacity: 150,
        underpaint: 54,
        bleed: 0.14,
        texture: 0.58,
        angle: 154,
        points: [
          [640, -100], [-140, -100], [-140, 455], [160, 515],
          [390, 345], [510, 150]
        ]
      },
      {
        color: "#94a18b",
        opacity: 136,
        underpaint: 46,
        bleed: 0.18,
        texture: 0.66,
        angle: 42,
        points: [
          [1250, 330], [960, 390], [790, 535], [850, 730],
          [1080, 895], [1250, 765]
        ]
      },
      {
        color: "#7fa49a",
        opacity: 136,
        underpaint: 46,
        bleed: 0.17,
        texture: 0.64,
        angle: 208,
        points: [
          [-140, 375], [110, 410], [340, 535], [300, 735],
          [60, 840], [-140, 755]
        ]
      },
      {
        color: "#c78e77",
        opacity: 150,
        underpaint: 54,
        bleed: 0.16,
        texture: 0.61,
        angle: 322,
        points: [
          [1240, 735], [930, 790], [700, 900], [535, 1140],
          [710, 1370], [1240, 1370]
        ]
      },
      {
        color: "#929faf",
        opacity: 136,
        underpaint: 46,
        bleed: 0.15,
        texture: 0.6,
        angle: 236,
        points: [
          [670, 900], [390, 760], [90, 835], [-140, 805],
          [-140, 1370], [710, 1370]
        ]
      },
      {
        color: "#f8faf9",
        opacity: 118,
        underpaint: 42,
        bleed: 0.1,
        texture: 0.5,
        angle: 8,
        points: [
          [945, 510], [750, 440], [440, 420], [220, 500], [100, 625],
          [250, 775], [485, 850], [790, 820], [1000, 720], [1020, 620]
        ]
      }
    ];

    function paintPlane(plane, index) {
      brush.noFill();
      brush.wash(plane.color, plane.underpaint);
      brush.polygon(plane.points);
      brush.noWash();

      randomSeed(73021 + index * 101);
      brush.fill(plane.color, plane.opacity);
      brush.fillBleed(plane.bleed, "out", plane.angle);
      brush.fillTexture(plane.texture, 0.18, true);
      brush.polygon(plane.points);
      brush.noFill();
    }

    function setup() {
      pixelDensity(1);
      createCanvas(ART_WIDTH, ART_HEIGHT, WEBGL);
      brush.load();

      background(PAPER);
      translate(-width / 2, -height / 2);

      angleMode(DEGREES);
      randomSeed(73021);
      noiseSeed(73021);
      brush.scaleBrushes(2);

      brush.noStroke();
      brush.noHatch();
      PLANES.forEach(paintPlane);

      document.body.dataset.rendered = "true";
    }
  </script>
</body>

</html>
